name: Testing Action

on:
  pull_request:
    paths:
      - hack/testing-action.sh
      - .github/workflows/testing-action.yaml

permissions:
  contents: read

jobs:
  test-action:
    name: Run testing script
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make script executable
        run: chmod +x hack/testing-action.sh

      - name: Run script
        run: ./hack/testing-action.sh
